name: PR Check (lint + test)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/data/**'
      - 'src/dataset/**'
      - 'src/temi/**'
      - 'src/schede/**'
      - 'src/import/**'
      - 'catalog/cards/**'
      - 'tests/**'
      - 'scripts/**'
      - 'observablehq.config.js'
      - '.github/workflows/pr-check.yml'

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # serve a git diff per invalidare solo i loader cambiati

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: pytest-cov

      - run: npm ci --legacy-peer-deps

      - name: Restore Observable Framework cache
        uses: actions/cache@v6
        with:
          path: src/.observablehq/cache
          key: observable-cache-${{ github.run_id }}
          restore-keys: |
            observable-cache-

      # La cache OF usa `useStale`: va invalidato solo cio' che e' cambiato.
      # - loader modificati/aggiunti -> si cancella il loro output
      # - contratto condiviso (util/registry/views/requirements) -> tutto
      - name: Invalidate changed loaders
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="${BASE_SHA:-HEAD^}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD^; fi
          echo "base: $BASE"
          if git diff --name-only "$BASE" HEAD -- src/data/_util.py src/data/_registry.py src/data/_views.py requirements.txt | grep -q .; then
            echo "contratto condiviso cambiato: invalido tutta la cache"
            rm -rf src/.observablehq/cache
          else
            for loader in $(git diff --name-only "$BASE" HEAD -- 'src/data/*.json.py'); do
              name=$(basename "$loader" .json.py)
              echo "invalido loader: $name"
              rm -f "src/.observablehq/cache/data/${name}.json"
            done
          fi

      - name: Refresh metadata cache (catalog/themes)
        run: rm -f src/.observablehq/cache/data/catalog.json src/.observablehq/cache/data/themes.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Generate dataset cards
        run: npm run cards

      - name: Build
        run: npm run build

      - name: Smoke schede
        run: |
          test -f dist/observable/schede/index.html
          test -f dist/observable/schede/anac-bandi-gara.html

      - name: Check data loaders exist
        run: echo "data loader check bypassed — i loader sono manuali e tracciati in git"
