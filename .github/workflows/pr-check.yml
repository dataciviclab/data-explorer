name: PR Check (lint + test)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'src/data/**'
      - 'src/dataset/**'
      - 'src/temi/**'
      - 'src/schede/**'
      - 'src/import/**'
      - 'catalog/cards/**'
      - 'tests/**'
      - 'scripts/**'
      - 'observablehq.config.js'
      - '.github/workflows/pr-check.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # serve a git diff per invalidare solo i loader cambiati

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: pytest-cov

      - run: npm ci --legacy-peer-deps

      - name: Restore Observable Framework cache
        uses: actions/cache@v6
        with:
          path: src/.observablehq/cache
          key: observable-cache-${{ github.run_id }}
          restore-keys: |
            observable-cache-

      - name: Restore dataset cards cache
        uses: actions/cache@v6
        with:
          path: src/data/cards.json
          key: cards-${{ github.run_id }}
          restore-keys: |
            cards-

      # Il PR verifica il codice, non il dato: i loader toccati girano, gli
      # altri vengono dalla cache. Un cambio di requirements/contratto condiviso
      # non fa il full qui — lo valida il deploy. Build atteso: 1–3 min.
      - name: Invalidate changed loaders
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPORT: ${{ runner.temp }}/invalidated-loaders.txt
        run: |
          python3 scripts/invalidate_cache.py \
            --base "${BASE_SHA:-}" \
            --on-shared reuse \
            --report "$REPORT"

      - name: Refresh metadata cache (catalog/themes)
        run: rm -f src/.observablehq/cache/data/catalog.json src/.observablehq/cache/data/themes.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Generate dataset cards
        run: npm run cards

      - name: Build
        run: npm run build

      # La cache si riusa: se un loader toccato non ha riscritto il suo output,
      # il build ha servito lo stale. Il PR deve accorgersene.
      - name: Audit dati (loader vuoti, mappe, superficie)
        run: npm run audit

      - name: Smoke — i loader invalidati sono girati
        run: |
          report="${{ runner.temp }}/invalidated-loaders.txt"
          [ -f "$report" ] || exit 0
          failed=0
          while read -r name; do
            [ -z "$name" ] && continue
            if [ ! -f "src/.observablehq/cache/data/${name}.json" ]; then
              echo "✗ ${name}: output non riscritto dopo l'invalidazione"
              failed=1
            fi
          done < "$report"
          exit $failed

      - name: Smoke schede
        run: |
          test -f dist/observable/schede/index.html
          test -f dist/observable/schede/anac-bandi-gara.html

      - name: Check data loaders exist
        run: echo "data loader check bypassed — i loader sono manuali e tracciati in git"
