name: Deploy to GitHub Pages (Observable Framework)

on:
  push:
    branches:
      - main
  repository_dispatch:
    # `catalog_updated`: solo metadati (ACB ha rigenerato l'indice).
    # `data_updated`: rinfresca i dataset indicati in `client_payload.datasets`
    # (slug DI o url_slug separati da virgola).
    types: [catalog_updated, data_updated]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Rilegge tutti i parquet (egress GCS). Default: solo metadati."
        type: boolean
        default: false
      datasets:
        description: "Dataset da rinfrescare (slug o url_slug, separati da virgola). Vuoto = solo metadati."
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # serve a git diff per invalidare solo i loader cambiati

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - uses: actions/configure-pages@v6
        id: pages

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main

      - name: Restore Observable Framework cache
        uses: actions/cache@v6
        with:
          path: src/.observablehq/cache
          key: observable-cache-${{ github.run_id }}
          restore-keys: |
            observable-cache-

      # Le schede sono incrementali: il file precedente è la base del riuso.
      - name: Restore dataset cards cache
        uses: actions/cache@v6
        with:
          path: src/data/cards.json
          key: cards-${{ github.run_id }}
          restore-keys: |
            cards-

      - name: Resolve refresh scope
        id: scope
        env:
          INPUT_DATASETS: ${{ inputs.datasets }}
          PAYLOAD_DATASETS: ${{ github.event.client_payload.datasets }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          datasets="${INPUT_DATASETS:-$PAYLOAD_DATASETS}"
          datasets="$(printf '%s' "$datasets" | tr -d '[:space:]')"
          echo "datasets=$datasets" >> "$GITHUB_OUTPUT"
          if [ "$FULL_REFRESH" = "true" ]; then
            echo "full=1" >> "$GITHUB_OUTPUT"
          else
            echo "full=" >> "$GITHUB_OUTPUT"
          fi
          echo "scope: datasets='$datasets' full='$FULL_REFRESH'"

      # `observable build` usa `useStale: true`: senza invalidazione servirebbe
      # dati vecchi. Qui si toglie dalla cache solo ciò che è cambiato.
      # - diff base..HEAD: loader modificati (contratto condiviso → full)
      # - `datasets` da dispatch: i loader che leggono quei mart
      - name: Invalidate stale loader cache
        env:
          BASE_SHA: ${{ github.event.before }}
          DATASETS: ${{ steps.scope.outputs.datasets }}
          FULL: ${{ steps.scope.outputs.full }}
          REPORT: ${{ runner.temp }}/invalidated-loaders.txt
        run: |
          if [ "$FULL" = "1" ]; then
            python3 scripts/invalidate_cache.py --full --report "$REPORT"
          else
            python3 scripts/invalidate_cache.py \
              --base "${BASE_SHA:-}" \
              --datasets "$DATASETS" \
              --on-shared full \
              --report "$REPORT"
          fi

      - name: Refresh metadata cache (catalog/themes)
        run: rm -f src/.observablehq/cache/data/catalog.json src/.observablehq/cache/data/themes.json

      - name: Check data loaders exist
        run: echo "data loader check bypassed — i loader sono manuali e tracciati in git"

      # `full_refresh` riguarda anche le schede: se i mart sono cambiati senza
      # un nuovo `last_run`, i fingerprint non si muovono e le schede restano
      # vecchie mentre le pagine sono fresche. Qui si forza tutto.
      - name: Generate dataset cards (incremental)
        env:
          DATASETS: ${{ steps.scope.outputs.datasets }}
          FULL: ${{ steps.scope.outputs.full }}
        run: |
          if [ "$FULL" = "1" ]; then
            npm run cards -- --force
          elif [ -n "$DATASETS" ]; then
            npm run cards -- --only "$DATASETS"
          else
            npm run cards
          fi

      - name: Build Observable Framework
        run: npm run build

      # Se un loader invalidi non ha riscritto il suo output, il build ha
      # servito lo stale (o è fallito): meglio rompere qui che pubblicare
      # numeri vecchi. Vale anche per `full_refresh`.
      - name: Smoke — i loader invalidati sono girati
        run: |
          report="${{ runner.temp }}/invalidated-loaders.txt"
          [ -f "$report" ] || exit 0
          failed=0
          while read -r name; do
            [ -z "$name" ] && continue
            if [ ! -f "src/.observablehq/cache/data/${name}.json" ]; then
              echo "✗ ${name}: output non riscritto dopo l'invalidazione"
              failed=1
            fi
          done < "$report"
          exit $failed

      - name: Smoke — catalogo fresco
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const dir = "dist/observable/_file/data";
          const file = fs.readdirSync(dir).find((f) => /^catalog\.[0-9a-f]+\.json$/.test(f));
          if (!file) {
            console.error("catalog.json non trovato nel build");
            process.exit(1);
          }
          const catalog = JSON.parse(fs.readFileSync(path.join(dir, file), "utf-8"));
          const ageHours = (Date.now() - Date.parse(catalog.updated_at)) / 36e5;
          console.log(`catalog updated_at=${catalog.updated_at} age=${ageHours.toFixed(1)}h total=${catalog.total}`);
          if (ageHours > 26) {
            console.error("catalogo stantio (>26h): cache dei metadati non invalidata?");
            process.exit(1);
          }
          NODE

      - name: Smoke — le pagine standard devono esistere nel build
        run: |
          test -f dist/observable/dataset/entrate-stato.html
          test -f dist/observable/dataset/cinque-per-mille.html
          test -f dist/observable/dataset/dipendenti-pubblici.html
          test -f dist/observable/schede/index.html
          test -f dist/observable/schede/anac-bandi-gara.html

      - name: Copy CNAME for custom domain
        run: cp static/CNAME dist/observable/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/observable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
