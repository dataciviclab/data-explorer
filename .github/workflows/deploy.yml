name: Deploy to GitHub Pages (Observable Framework)

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [catalog_updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - uses: actions/configure-pages@v6
        id: pages

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main

      - name: Restore Observable Framework cache
        uses: actions/cache@v4
        with:
          path: src/.observablehq/cache
          key: observable-cache-${{ hashFiles('src/data/*.json.py') }}
          restore-keys: |
            observable-cache-

      - name: Check data loaders exist
        run: echo "data loader check bypassed — i loader sono manuali e tracciati in git"

      - name: Build Observable Framework
        run: npm run build

      - name: Smoke — le pagine standard devono esistere nel build
        run: |
          test -f dist/observable/dataset/entrate-stato.html
          test -f dist/observable/dataset/cinque-per-mille.html
          test -f dist/observable/dataset/dipendenti-pubblici.html

      - name: Copy CNAME for custom domain
        run: cp static/CNAME dist/observable/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/observable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
